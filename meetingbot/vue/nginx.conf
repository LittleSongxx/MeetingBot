# 生产环境 nginx 配置：静态文件由 nginx 直接返回，接口和文件资源反代到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 会议资料单个文件上限 500MB，nginx 默认的 1MB 会直接返回 413
    client_max_body_size 512m;

    # 容器健康检查用，docker healthcheck 请求这个地址
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 前端接口：VITE_BASE_URL 是 /api，这里去掉前缀后转发给后端
    # 关闭缓冲，Agent 自检的事件流（SSE）才能逐条实时到达浏览器
    location /api/ {
        proxy_pass http://backend:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection 让 SSE 保持长连接，不被 nginx 按普通请求断开
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # 大文件上传边收边转，不在 nginx 上先缓冲整份文件
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 后端返回的头像、资料等资源是 /files/... 相对路径，同样反代到后端
    location /files/ {
        proxy_pass http://backend:9090/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端是 history 路由，刷新 /manager/... 时找不到对应文件，统一回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
