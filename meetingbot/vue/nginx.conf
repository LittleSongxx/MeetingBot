# 生产环境 nginx 配置：静态文件由 nginx 直接返回，接口和文件资源反代到后端容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 不把 nginx 版本号写进响应头，减少指纹信息
    server_tokens off;

    # 会议资料单个文件上限 500MB，nginx 默认的 1MB 会直接返回 413
    client_max_body_size 512m;

    # 文本资源开启 gzip：前端入口 JS 约 1.9MB、CSS 约 0.5MB，压缩后传输量能降一个数量级
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 基础安全响应头；注意 nginx 的 add_header 只在当前层级继承，
    # 下面凡是自己写了 add_header 的 location 都会重复声明这几行
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 脚本/样式/接口全部同源；图片和媒体额外允许 data:/blob:（头像 data、资料预览 blob）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 容器健康检查用，docker healthcheck 请求这个地址
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 前端接口：VITE_BASE_URL 是 /api，这里去掉前缀后转发给后端
    # 关闭缓冲，Agent 自检的事件流（SSE）才能逐条实时到达浏览器
    location /api/ {
        proxy_pass http://backend:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection 让 SSE 保持长连接，不被 nginx 按普通请求断开
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # 大文件上传边收边转，不在 nginx 上先缓冲整份文件
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 后端返回的头像、资料等资源是 /files/... 相对路径，同样反代到后端
    location /files/ {
        proxy_pass http://backend:9090/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 头像/资料变化频率低，缓存一天；这里写了 add_header，安全头要重复声明
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Vite 构建产物文件名带内容 hash，可以放心长缓存 + immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # location 内出现 add_header 会覆盖 server 级配置，安全头需要重复声明
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # 前端是 history 路由，刷新 /manager/... 时找不到对应文件，统一回落到 index.html；
    # index.html 不缓存，保证发布后浏览器能立刻拿到新的 assets 引用
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # 同样要重复安全头（location 内 add_header 覆盖 server 级）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
}
