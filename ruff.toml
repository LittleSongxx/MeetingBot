# 全仓 Python lint 规则（产品 + 评测 + 脚本共用）
#
# 选规则的原则：**优先抓真错误，不做纯风格重排**。
# - F  未定义名 / 未用导入 / 未用变量 —— 真的会出错或藏着死代码
# - E4/E7/E9 导入写法与语法级问题
# - I  导入排序（机械、零风险、diff 可读）
# - B  bugbear：except 里 raise 丢 cause 链、闭包捕获循环变量等已知坑
# - C4 推导式冗余
# - SIM 可化简写法
#
# 明确不加的：
# - E501 行宽：交给 formatter，不让它阻塞 CI（本仓最长注释多在中文说明处）
# - UP 注解现代化：会产生跨 50+ 文件的无意义 diff，收益低
# - B008 在下面 ignore：FastAPI 的 Depends() 必须写在默认参数里，这是框架惯用法

target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI：Depends()/File() 作为默认参数是必需写法，不是缺陷
]
