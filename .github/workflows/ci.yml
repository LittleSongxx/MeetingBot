# 每次推送与 PR 都跑：lint、产品单测、评测零调用回归、前端构建。
#
# 三条纪律：
#   1. 只跑零调用的检查——CI 不花模型调用预算（评测的 L1/L2 需人工授权，见 evaluation/README.md）
#   2. 同一分支的新推送取消上一次未跑完的作业，不排队烧时间
#   3. runner 钉版本（不用 ubuntu-latest），避免镜像静默升级导致"昨天还绿今天红"
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先判断改了哪一侧，避免"只改了 README 也全量跑"。paths 用反向匹配，
  # 这样新增顶层目录时默认会被判为"后端相关"，宁可多跑也不漏跑。
  changes:
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'meetingbot/vue/**'
            backend:
              - '**'
              - '!meetingbot/vue/**'
              - '!docs/**'
              - '!**/*.md'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            meetingbot/fastapi-app/requirements.txt
            meetingbot/fastapi-app/requirements-dev.txt

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
        working-directory: meetingbot/fastapi-app

      - name: 安装 ffmpeg 与中文字体（转写时长预检 / PDF 导出测试依赖）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-wqy-zenhei

      - name: Lint（ruff，规则集见根目录 ruff.toml）
        run: ruff check .

      - name: 产品单测（零模型调用；sqlite 内存库）
        run: python -m unittest discover -s tests -p 'test_*.py' -v
        working-directory: meetingbot/fastapi-app

      # 评测侧的两条命令都零调用：test 是评测代码自测，smoke 是 L0 离线复算。
      # PY=python 覆盖 Makefile 里默认指向 .venv 的解释器（CI 里没有 venv）。
      - name: 评测代码自测（零调用）
        run: make test PY=python
        working-directory: evaluation

      - name: L0 零调用回归（契约不变量/可定位率/问答引用不变量/可靠性复算）
        # 评测产物与语料不入库：CI 没有本地结果集时数值复算跳过（--allow-empty），
        # 其余零调用不变量照常跑；本地 `make smoke` 仍以缺数据为失败。
        run: make smoke PY=python SMOKE_ARGS=--allow-empty
        working-directory: evaluation

  # ParadeDB 实库：BM25 的 DDL/分词/过滤与 PG checkpoint 只在真实扩展上才成立。
  # 这两个测试没有 DSN 会跳过，所以必须单独给服务并显式传 PG_TEST_DSN；
  # 合并进 backend job 会让它们继续静默跳过，等于没测。
  postgres-integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: paradedb/paradedb:latest-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetingbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetingbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            meetingbot/fastapi-app/requirements.txt
            meetingbot/fastapi-app/requirements-dev.txt

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
        working-directory: meetingbot/fastapi-app

      - name: PG 实库集成（BM25 + pgvector + checkpoint）
        run: python -m unittest tests.test_pg_kb_integration tests.test_agent_checkpoint -v
        working-directory: meetingbot/fastapi-app
        env:
          PG_TEST_DSN: postgresql://postgres:postgres@localhost:5432/meetingbot_test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 是当前 LTS；工具链里已有包要求 >=22.22（eslint 10 / vitest 4），
          # 钉 20 会在安装阶段就报 EBADENGINE
          node-version: '22'
          cache: npm
          cache-dependency-path: meetingbot/vue/package-lock.json

      - name: 安装依赖（npm ci 按 lock 文件精确安装）
        run: npm ci
        working-directory: meetingbot/vue

      - name: 类型检查（vue-tsc --noEmit）
        run: npm run type-check
        working-directory: meetingbot/vue

      - name: Lint（ESLint，格式交给 Prettier）
        run: npm run lint
        working-directory: meetingbot/vue

      - name: 格式检查（prettier --check）
        run: npm run format:check
        working-directory: meetingbot/vue

      - name: 前端单测（vitest，jsdom）
        run: npm run test
        working-directory: meetingbot/vue

      - name: 构建（vite build）
        run: npm run build
        working-directory: meetingbot/vue
