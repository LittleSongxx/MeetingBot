# 本地提交前钩子（可选）。CI 只跑后端单测与前端构建，不跑 ruff；
# 这里的 ruff hook 需要先 pip install pre-commit 才会生效，详见下方命令。
#
# 安装（在后端 venv 里）：
#   meetingbot/fastapi-app/.venv/bin/pre-commit install
# 全量手动跑一次：
#   meetingbot/fastapi-app/.venv/bin/pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^meetingbot/fastapi-app/files/
      - id: end-of-file-fixer
        exclude: ^meetingbot/fastapi-app/files/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      # 演示用音视频/图片素材不入库，大文件检查跳过该目录
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: ^meetingbot/fastapi-app/files/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 CI/本地 venv 里装的版本保持一致，升级时两边一起改
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^meetingbot/fastapi-app/.*\.py$
