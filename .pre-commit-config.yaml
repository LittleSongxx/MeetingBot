# 本地提交前钩子。CI 里跑的是同一套 ruff 配置（见 .github/workflows/ci.yml）。
#
# 安装：meetingbot/fastapi-app/.venv/bin/pre-commit install
# 全量手动跑一次：meetingbot/fastapi-app/.venv/bin/pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(evaluation/results/|docs/assets/)
      - id: end-of-file-fixer
        exclude: ^(evaluation/results/|docs/assets/)
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      # 大文件与二进制产物不入库（评测得靠脚本复得语料，见 evaluation/README.md）
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: ^docs/assets/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与制品环境里装上的一致；升级时两边一起改
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^(meetingbot/fastapi-app/|evaluation/|scripts/).*\.py$
