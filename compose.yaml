name: meetingbot-local

services:
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meetingbot}
      MYSQL_USER: ${MYSQL_USER:-meetingbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      # 空卷初始化：先建表结构再灌演示数据（两个文件按文件名顺序执行）。
      # 表结构的真源是 models.py，schema.sql 必须与它一致（有零调用的漂移测试兜底）。
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/03-model-prices.sql:/docker-entrypoint-initdb.d/03-model-prices.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -Nse 'SELECT 1 FROM prompt_template LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # PostgreSQL（ParadeDB）：pgvector dense + BM25 + LangGraph checkpoint。
  # 业务真源仍是 MySQL；PG 只放两样可重建/可丢弃的派生数据。
  # 镜像固定 PG17：PG18 的 volume 路径与扩展基线不同，升级要单独验证。
  postgres:
    image: paradedb/paradedb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-meetingbot}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DATABASE:-meetingbot}
      TZ: Asia/Shanghai
    command: ["-c", "shared_preload_libraries=pg_search"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s


  # MOSS 本地 SA-ASR 侧车（可选，profile: moss）。
  # 启用：在 .env 设 TRANSCRIPTION_ENGINE=http / ASR_HTTP_URL=http://asr-sidecar:9971/transcribe
  # + MOSS_MODEL_HOST_DIR=<含 MOSS-Transcribe-Diarize 权重的目录>，然后
  #   ./scripts/compose.sh --profile moss up -d asr-sidecar backend
  # 侧车在 compose 网络内，不需要映射宿主端口（调试时可取消 ports 注释）。
  asr-sidecar:
    build:
      context: ./scripts
      dockerfile: asr_sidecar/Dockerfile
    profiles: ["moss"]
    restart: unless-stopped
    gpus: all
    environment:
      MOSS_MODEL: /models
      MOSS_DEVICE: cuda:0
      MOSS_DTYPE: bf16
      TZ: Asia/Shanghai
    volumes:
      - ${MOSS_MODEL_HOST_DIR:?请在 .env 设置 MOSS_MODEL_HOST_DIR 指向 MOSS 权重目录}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9971/health',timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    # ports:
    #   - "127.0.0.1:9973:9971"

  # Jaeger：OTLP 链路追踪后端（P1 可观测性）。
  # 默认随 compose 启动；不需要时可在 .env 设 OTEL_EXPORTER_OTLP_ENDPOINT= 并停掉本服务。
  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  backend:
    build: ./meetingbot/fastapi-app
    restart: unless-stopped
    env_file: ./meetingbot/fastapi-app/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      SQL_ECHO: "false"
      TZ: Asia/Shanghai
      # PG：pgvector + BM25 在 kb schema，checkpoint 在 langgraph schema
      PG_DSN: postgresql://${PG_USER:-meetingbot}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE:-meetingbot}
      # 生产默认启用 checkpoint；PG 不可用时 checkpoint 不启用并记录 warning
      CHAT_CHECKPOINT_ENABLED: "1"
      # 限流与问答预算的集中式计数（多副本 backend 共享一份，见 common/ratelimit.py）
      REDIS_URL: redis://redis:6379/0
      # JWT 密钥必须显式提供（settings.py 已 fail-fast，这里再拦一道部署层）
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      # 反向代理在 Docker 网络内；信任其 X-Forwarded-For，否则所有用户共享代理 IP。
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # 用 `-` 而不是 `:-`：显式空串表示“同源部署、不允许跨域”，不能回落成 *
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS-*}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19091}:9090"
    volumes:
      - ./meetingbot/fastapi-app/files:/app/files
      - ./evaluation:/evaluation
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 让容器能用 host.docker.internal 访问宿主机上的本地 ASR 侧车
    #（TRANSCRIPTION_ENGINE=http 时才需要；默认 dashscope 不受影响）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./meetingbot/vue
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-18082}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 限流与配额的集中式计数：backend 多副本时进程内计数会各算一份，
  # 阈值被隐性放大（见 common/ratelimit.py 的模块文档）
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # 只做计数，数据可丢：不开持久化，容器重启后窗口重新开始（最坏是多放几个请求）
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: mysql8
      DB_PORT: "3306"
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      MYSQL_SEEDS: db
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DISABLE_ES: "true"
      # auto-setup 默认绑容器自身 IP（BIND_ON_IP）；显式绑全网卡，
      # 健康检查（127.0.0.1）与跨容器访问（temporal:7233）都通
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ADDRESS: 0.0.0.0:7233
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-17233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster describe --address 127.0.0.1:7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  temporal-worker:
    build: ./meetingbot/fastapi-app
    restart: unless-stopped
    command: ["python", "temporal_worker.py"]
    env_file: ./meetingbot/fastapi-app/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      SQL_ECHO: "false"
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      TEMPORAL_ADDRESS: temporal:7233
      PG_DSN: postgresql://${PG_USER:-meetingbot}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE:-meetingbot}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    volumes:
      - ./meetingbot/fastapi-app/files:/app/files
      - ./evaluation:/evaluation
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy


volumes:
  mysql_data:
  # PG 里只有派生检索索引（可从 MySQL 重建）与 checkpoint（丢了只是
  # 在途对话不能续跑）。仍持久化，避免每次重启都重建。
  postgres_data:
