name: meetingbot-local

services:
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meetingbot}
      MYSQL_USER: ${MYSQL_USER:-meetingbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      # 空卷初始化：先建表结构再灌演示数据（两个文件按文件名顺序执行）。
      # 表结构的真源是 models.py，schema.sql 必须与它一致（有零调用的漂移测试兜底）。
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -Nse 'SELECT 1 FROM prompt_template LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./meetingbot/fastapi-app
    restart: unless-stopped
    env_file: ./meetingbot/fastapi-app/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      SQL_ECHO: "false"
      TZ: Asia/Shanghai
      # 向量库：容器间走内部网络，不暴露到宿主
      QDRANT_URL: http://qdrant:6333
      # 限流与问答预算的集中式计数（多副本 backend 共享一份，见 common/ratelimit.py）
      REDIS_URL: redis://redis:6379/0
      # JWT 密钥必须显式提供（settings.py 已 fail-fast，这里再拦一道部署层）
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19091}:9090"
    volumes:
      - ./meetingbot/fastapi-app/files:/app/files
      - ./evaluation:/evaluation
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 让容器能用 host.docker.internal 访问宿主机上的本地 ASR 侧车
    #（TRANSCRIPTION_ENGINE=http 时才需要；默认 dashscope 不受影响）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./meetingbot/vue
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-18082}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 向量检索底座：MySQL 8.4 没有向量类型、Community 9.x 也缺 ANN 索引，
  # 而知识库既要按会议过滤、又要混合检索（dense + sparse 由它做服务端 RRF 融合）。
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    # 不映射宿主端口：只有 backend 与 worker 用它，内部网络足够
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 限流与配额的集中式计数：backend 多副本时进程内计数会各算一份，
  # 阈值被隐性放大（见 common/ratelimit.py 的模块文档）
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # 只做计数，数据可丢：不开持久化，容器重启后窗口重新开始（最坏是多放几个请求）
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: mysql8
      DB_PORT: "3306"
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      MYSQL_SEEDS: db
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DISABLE_ES: "true"
      # auto-setup 默认绑容器自身 IP（BIND_ON_IP）；显式绑全网卡，
      # 健康检查（127.0.0.1）与跨容器访问（temporal:7233）都通
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ADDRESS: 0.0.0.0:7233
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-17233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster describe --address 127.0.0.1:7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  temporal-worker:
    build: ./meetingbot/fastapi-app
    restart: unless-stopped
    command: ["python", "temporal_worker.py"]
    env_file: ./meetingbot/fastapi-app/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      SQL_ECHO: "false"
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      TEMPORAL_ADDRESS: temporal:7233
      QDRANT_URL: http://qdrant:6333
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    volumes:
      - ./meetingbot/fastapi-app/files:/app/files
      - ./evaluation:/evaluation
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      qdrant:
        condition: service_healthy


volumes:
  mysql_data:
  # 向量索引体积小（切片级），但丢了要重嵌花钱，所以单独持久化
  qdrant_data:
